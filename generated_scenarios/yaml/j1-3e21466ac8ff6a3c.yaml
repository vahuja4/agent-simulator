name: j1-3e21466ac8ff6a3c
journey: J1
description: The user wants to make a one-time credit card payment. They first indicate
  card ending in 0767, ask to pay the statement balance from account ending in 5678
  on the due date, then switch to card ending in 4421 after hearing the available
  payment options. The assistant must refetch options for card 4421, validate the
  selected payment, retry validation if needed, obtain explicit confirmation, submit
  the validated one-time payment, and terminate.
persona:
  name: Jordan
  traits: patient, attentive to amounts, concise upfront, changes mind once
goal: Pay the statement balance on the due date for the credit card ending in 4421,
  using the deposit account ending in 5678, after initially selecting card ending
  in 0767 and then switching cards.
knowledge:
  cards:
  - '0767'
  - '4421'
  accounts:
  - '5678'
success_criteria:
- Disambiguate by last four digits and select the initially requested card ending
  in 0767 before fetching options.
- "After options are presented, handle the user\u2019s card switch to card ending\
  \ in 4421 by resetting the payment context and refetching payment options for card\
  \ 4421."
- Use only the statement balance amount returned in the options for card 4421; do
  not reuse amounts or options from card 0767.
- Set the payment date to the due date and the funding account to account ending in
  5678.
- Validate the one-time payment with AddValidateOneTimePayment and retry validation
  when prompted by the scenario.
- "Before submission, get the user\u2019s explicit confirmation of the validated card,\
  \ amount, date, and funding account."
- Submit the payment only through AddOneTimePayment after successful validation and
  explicit confirmation.
- Terminate after confirming the payment submission outcome.
max_turns: 14
tool_assertions:
- type: validated_submit
  submit: AddOneTimePayment
  validate: AddValidateOneTimePayment
- type: refetch_after_card_switch
- type: amount_in_options
