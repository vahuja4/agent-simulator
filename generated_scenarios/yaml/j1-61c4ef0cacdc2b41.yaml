name: j1-61c4ef0cacdc2b41
journey: J1
description: A cardholder wants to make a one-time payment for the statement balance
  on their card. They will provide the card ending in 0767 and use the account ending
  in 5678, with the payment scheduled for the due date. The assistant must fetch available
  payment options, validate the payment, obtain explicit confirmation, submit it using
  the validated result, and then end the interaction.
persona:
  name: Cardholder
  traits: patient, trusts presented amounts, concise upfront, decisive
goal: Make a one-time payment for the statement balance on card ending in 0767 from
  account ending in 5678 on the due date.
knowledge:
  cards:
  - '0767'
  accounts:
  - '5678'
success_criteria:
- The card ending in 0767 is selected.
- The payment account ending in 5678 is used.
- The payment amount is the statement balance.
- The payment date is the due date.
- Available payment options are fetched before validation.
- The payment is validated with AddValidateOneTimePayment before submission.
- The assistant gets explicit confirmation before submitting the payment.
- The submitted payment uses AddOneTimePayment and matches the validated payment details.
- The interaction terminates after submission.
max_turns: 10
tool_assertions:
- type: validated_submit
  submit: AddOneTimePayment
  validate: AddValidateOneTimePayment
