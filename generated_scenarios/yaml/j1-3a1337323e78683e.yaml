name: j1-3a1337323e78683e
journey: J1
description: The customer wants to make a one-time credit card payment from account
  ending 5678. They initially select card ending 9013, ask for payment options, then
  switch to card ending 0767 after options are presented. Because the card changes,
  the payment options must be fetched again for the new card. During validation, a
  warning is returned, so the flow should validate again as required before proceeding.
  The payment is for the statement balance on the due date, using only amounts returned
  in the available options, and the final submission must match the successfully validated
  details.
persona:
  name: Jordan
  traits: patient, attentive to amounts, concise upfront, changes mind once
goal: Make a one-time payment for the statement balance due on the due date to the
  final selected card ending 0767, funded from account ending 5678, after refetching
  options due to the card switch and completing validation despite the warning.
knowledge:
  cards:
  - '9013'
  - '0767'
  accounts:
  - '5678'
success_criteria:
- Customer discloses they want a one-time credit card payment from account ending
  5678.
- Initial card selection is card ending 9013, and payment options are fetched for
  that card.
- After options are presented, customer switches to card ending 0767.
- The card switch resets the prior options, and payment options are fetched again
  for card ending 0767 before continuing.
- The selected payment uses the statement balance amount and due date exactly as provided
  in the options for card ending 0767.
- Validation is performed with AddValidateOneTimePayment for the selected payment
  details.
- If validation returns a warning, validation is handled again as required before
  confirmation.
- The customer gives explicit confirmation before submission.
- Submission is made with AddOneTimePayment only after successful validation and explicit
  confirmation.
- 'The submitted payment details match the validated details: card ending 0767, account
  ending 5678, statement balance, and due date.'
max_turns: 14
tool_assertions:
- type: validated_submit
  submit: AddOneTimePayment
  validate: AddValidateOneTimePayment
- type: refetch_after_card_switch
- type: amount_in_options
