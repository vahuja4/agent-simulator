name: j1-1a8cef237cb9a615
journey: J1
description: The customer wants to make a one-time payment from bank account ending
  in 5678 for the statement balance on the due date. They initially select card ending
  in 9013. After payment options are presented, they switch to card ending in 0767,
  requiring the options to be fetched again before continuing. At submission, the
  payment attempt fails, and the interaction should terminate without claiming the
  payment was scheduled.
persona:
  name: Jordan
  traits: patient, attentive to amounts, concise upfront, changes mind once
goal: Make a one-time payment for the statement balance on the due date using bank
  account ending in 5678, ultimately for card ending in 0767 after switching from
  card ending in 9013.
knowledge:
  cards:
  - '9013'
  - '0767'
  accounts:
  - '5678'
success_criteria:
- Customer clearly discloses they want to pay the statement balance on the due date
  from account ending in 5678.
- Assistant has the customer select card ending in 9013 first, fetches payment options,
  then handles the customer switching to card ending in 0767.
- After the card switch, assistant refetches payment options for card ending in 0767
  before validation.
- Assistant validates the one-time payment using AddValidateOneTimePayment, with the
  amount matching an offered payment option.
- Assistant obtains explicit confirmation before attempting submission.
- Assistant submits using AddOneTimePayment only after successful validation and explicit
  confirmation.
- Because submission fails, assistant truthfully reports the failure and does not
  state or imply that the payment was scheduled.
max_turns: 14
tool_assertions:
- type: validated_submit
  submit: AddOneTimePayment
  validate: AddValidateOneTimePayment
- type: refetch_after_card_switch
- type: amount_in_options
