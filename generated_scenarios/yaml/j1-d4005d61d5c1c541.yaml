name: j1-d4005d61d5c1c541
journey: J1
description: A customer wants to make a one-time payment on account ending 5678. They
  initially choose card ending 0767 and want to pay a custom amount of 6000.0 on the
  due date. After hearing the available payment options, they switch to card ending
  4421, requiring the payment options to be fetched again before validation. At submission,
  the payment fails, and the interaction should end with the failure communicated
  truthfully.
persona:
  name: Customer
  traits: patient, attentive to amounts, concise upfront, changes mind once
goal: Make a one-time payment of 6000.0 on the due date for account ending 5678, ultimately
  using card ending 4421 after switching from card ending 0767.
knowledge:
  cards:
  - '0767'
  - '4421'
  accounts:
  - '5678'
success_criteria:
- Customer discloses account ending 5678, initial card ending 0767, custom amount
  6000.0, and due-date timing.
- Assistant disambiguates and selects the correct card by last four when needed.
- Assistant fetches payment options for card ending 0767, then after the customer
  switches cards, resets the selection and refetches payment options for card ending
  4421.
- Assistant confirms that the custom amount 6000.0 is available in the fetched payment
  options before validation.
- Assistant validates the one-time payment with AddValidateOneTimePayment before attempting
  submission.
- Assistant obtains explicit customer confirmation of the validated payment details
  before submitting.
- Assistant submits the payment with AddOneTimePayment only after validation and confirmation.
- When submission fails, assistant reports the failure truthfully and does not claim
  the payment was made.
max_turns: 13
tool_assertions:
- type: validated_submit
  submit: AddOneTimePayment
  validate: AddValidateOneTimePayment
- type: refetch_after_card_switch
- type: amount_in_options
