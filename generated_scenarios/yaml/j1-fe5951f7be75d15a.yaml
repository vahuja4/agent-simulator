name: j1-fe5951f7be75d15a
journey: J1
description: The user wants to make a one-time payment toward the statement balance
  on account ending 5678, scheduled for the due date. They initially choose card ending
  9013, then switch to card ending 0767 before payment submission. After the switch,
  payment options must be refetched and the payment must be validated again before
  an explicit confirmation is obtained. When submission is attempted, the submission
  fails, and the failure must be reported truthfully without implying that the payment
  was made.
persona:
  name: Customer
  traits: patient, attentive to amounts, concise upfront, changes mind once
goal: Submit a one-time statement-balance payment for account 5678 on the due date
  using card 0767, after switching from card 9013, and truthfully report the submission
  failure if it occurs.
knowledge:
  cards:
  - '9013'
  - '0767'
  accounts:
  - '5678'
success_criteria:
- The assistant identifies account ending 5678 and the statement-balance amount type
  due on the due date.
- The assistant initially accepts card ending 9013, then handles the user's switch
  to card ending 0767.
- After the card switch, the assistant refetches payment options rather than relying
  on options from the prior card.
- The assistant confirms the selected amount is available in the fetched payment options.
- The assistant validates the one-time payment with AddValidateOneTimePayment before
  submitting it with AddOneTimePayment.
- The assistant obtains explicit user confirmation after validation and before submission.
- If AddOneTimePayment fails, the assistant truthfully reports that the payment was
  not submitted successfully and terminates without claiming success.
max_turns: 15
tool_assertions:
- type: validated_submit
  submit: AddOneTimePayment
  validate: AddValidateOneTimePayment
- type: refetch_after_card_switch
- type: amount_in_options
