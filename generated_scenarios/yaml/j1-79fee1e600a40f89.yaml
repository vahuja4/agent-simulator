name: j1-79fee1e600a40f89
journey: J1
description: The customer wants to make a one-time payment from account ending 5678.
  They initially disclose only part of the needed information, indicating they want
  to pay the statement balance on the due date for card ending 9013. After payment
  options are fetched, they switch to card ending 0767, which requires the payment
  options to be fetched again for the new card. During validation, the first attempt
  needs to be retried before the customer can explicitly confirm and the payment can
  be submitted.
persona:
  name: Customer
  traits: patient, trusts presented amounts, concise upfront, changes mind once
goal: Make a one-time payment of the statement balance on the due date for the final
  selected card ending 0767, using account ending 5678.
knowledge:
  cards:
  - '9013'
  - '0767'
  accounts:
  - '5678'
success_criteria:
- The assistant collects the initial card ending 9013 and payment intent, then handles
  the later switch to card ending 0767.
- After the card switch, the assistant refetches payment options before validation.
- The payment amount used is the statement balance amount provided by the fetched
  options for card ending 0767.
- If validation fails or requires retry, the assistant retries validation before proceeding.
- The assistant obtains explicit customer confirmation after successful validation
  and before submission.
- The assistant submits the payment using AddOneTimePayment only after a successful
  AddValidateOneTimePayment validation.
- The interaction terminates after the payment submission outcome is communicated.
max_turns: 14
tool_assertions:
- type: validated_submit
  submit: AddOneTimePayment
  validate: AddValidateOneTimePayment
- type: refetch_after_card_switch
- type: amount_in_options
