name: j1-df7bba79881e74dc
journey: J1
description: The customer wants to make a one-time credit card payment. They initially
  provide only part of the needed information, so the assistant must ask follow-up
  questions. The payment should be for the statement balance on the card ending in
  9013, paid from the account ending in 5678, scheduled for the due date. After validation,
  a retry is needed before moving forward. The assistant must rely on the returned
  payment options for the payable amount, obtain explicit confirmation, submit only
  the validated payment, and then end the interaction.
persona:
  name: Customer
  traits: patient, trusts presented amounts, answers as asked, decisive
goal: Make a one-time payment for the statement balance on card ending 9013 from account
  ending 5678 on the due date.
knowledge:
  cards:
  - '9013'
  - '0767'
  accounts:
  - '5678'
success_criteria:
- Customer discloses the payment intent and required details, including card ending
  9013, account ending 5678, statement balance, and due date.
- Assistant selects card ending 9013 and fetches the available payment options before
  validating payment details.
- If validation must be retried, the assistant performs the retry and proceeds only
  after successful validation.
- Assistant uses the statement balance amount from the fetched payment options and
  does not invent or alter the amount.
- Assistant obtains explicit customer confirmation after validation and before submission.
- Assistant submits the payment using the validated one-time payment details.
- If the customer switches cards at any point, the assistant resets the flow and refetches
  payment options for the newly selected card.
- Assistant terminates the interaction after the payment submission outcome is provided.
max_turns: 11
tool_assertions:
- type: validated_submit
  submit: AddOneTimePayment
  validate: AddValidateOneTimePayment
- type: refetch_after_card_switch
- type: amount_in_options
