name: j1-ed8fef83a7017aa7
journey: J1
description: The customer wants to make a one-time payment from account ending 5678
  for the statement balance due on the due date. They first indicate card ending 0767,
  but later switch to card ending 4421. During validation, there is a validation block
  that must be resolved before the payment can be confirmed and submitted.
persona:
  name: Customer
  traits: patient, attentive to amounts, concise upfront, changes mind once
goal: Make a one-time payment for the statement balance on the due date, using account
  ending 5678 and ultimately applying it to card ending 4421 after switching from
  card ending 0767.
knowledge:
  cards:
  - '0767'
  - '4421'
  accounts:
  - '5678'
success_criteria:
- Disambiguate and select the initially provided card ending 0767 before fetching
  payment options.
- After the customer switches to card ending 4421, reset the prior card selection
  and refetch payment options for card ending 4421.
- Use only the statement balance amount returned in the payment options; do not invent
  or alter the amount.
- Validate the one-time payment with AddValidateOneTimePayment before submission.
- Handle the validation block truthfully according to the validation result, then
  re-validate successfully before proceeding.
- Obtain explicit confirmation from the customer before submitting the payment.
- Submit the validated payment using AddOneTimePayment only after successful validation
  and confirmation.
- Ensure the final submitted payment uses account ending 5678, card ending 4421, the
  statement balance, and the due date.
max_turns: 14
tool_assertions:
- type: validated_submit
  submit: AddOneTimePayment
  validate: AddValidateOneTimePayment
- type: refetch_after_card_switch
- type: amount_in_options
