[project]
name = "agentsim"
version = "0.1.0"
description = "Framework-agnostic adversarial simulation harness for conversational agents (payments agent gym)"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "pyyaml>=6.0",
]

[project.scripts]
scenario-synthesis = "scenario_synthesis.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentsim*", "fixtures*", "scenario_synthesis*"]

[tool.setuptools.package-data]
scenario_synthesis = [
    "*.yaml",
    "blueprints/*.yaml",
    "contracts/*.yaml",
    "procedures/*.yaml",
    "prompts/*.txt",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Keep any future live tests opt-in even though Task 5a superseded the legacy
# smoke test with explicit synthesis commands.
addopts = '-m "not live"'
markers = [
    "live: makes real LLM API calls; excluded from the default offline suite",
]
