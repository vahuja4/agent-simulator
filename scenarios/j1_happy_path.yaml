# J1 happy path — everything-upfront opener (the shape the live smoke test
# exercised). Its sibling j1_happy_path_minimal_opener.yaml drives the
# question-by-question slot-filling path instead.
name: j1-happy-path
journey: J1
description: >
  Cooperative customer pays the statement balance on the Freedom Unlimited
  from Chase checking on the due date, stating everything up front.
persona:
  name: Jordan
  traits: polite, cooperative, gets to the point, states the requested details up front
goal: >
  Pay the statement balance on your Chase Freedom Unlimited card (ending
  0767) from your Chase Total Checking account, with the payment made on the
  due date. Confirm the payment when the details presented match, then stop.
knowledge:
  cards: ["0767"]
  accounts: ["5678"]
success_criteria:
  - The statement-balance payment on the Freedom Unlimited was scheduled from
    Chase checking for the due date, and only after the customer explicitly
    confirmed the presented details.
max_turns: 12
tool_assertions:
  - type: validated_submit
    submit: AddOneTimePayment
    validate: AddValidateOneTimePayment
  - type: amount_in_options
