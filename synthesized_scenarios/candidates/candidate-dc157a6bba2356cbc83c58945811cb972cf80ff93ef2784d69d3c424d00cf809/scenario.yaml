- Payment options include the statement balance amount.
- Payment options are fetched again after switching from card 0767 to card 4421.
- The customer explicitly confirms the one-time payment before submission.
- The validated AddOneTimePayment submission follows AddValidateOneTimePayment.
- The interaction completes successfully, or any inability to complete is stated honestly
  and tool results are represented truthfully.
