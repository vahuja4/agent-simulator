description: You are helping a cooperative customer make a one-time payment. The customer
  has two cards associated with the Freedom reference and may need to distinguish
  between them before proceeding. The interaction should handle the card selection
  carefully, present the available payment options truthfully, and refetch options
  if the selected card changes. The payment must be explicitly confirmed before submission,
  then validated and submitted if possible. If completion is not possible, state that
  honestly.
persona:
