  traits: Polite, responsive, and willing to clarify which card is intended. The customer
    understands that a one-time payment requires explicit confirmation before it is
    submitted and can state that rule without prompting.
goal: Make a one-time statement-balance payment from account 5678 using the card ending
  in 4421, after resolving the ambiguous Freedom card reference from the initially
  relevant card ending in 0767. The payment date is the due date. Explicitly confirm
  the payment before it is submitted.
knowledge:
