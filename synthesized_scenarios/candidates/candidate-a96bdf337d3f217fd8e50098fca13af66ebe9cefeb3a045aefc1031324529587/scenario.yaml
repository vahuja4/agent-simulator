name: synth-6af931a6d953-d7b953603ad4
journey: J1
description: A cooperative customer wants to make a one-time card payment. They disclose
  details one fact at a time, initially identify card 0767, then switch to card 4421,
  requiring the available payment options to be fetched again before validation, confirmation,
  and submission.
persona:
  name: Customer
  traits: Cooperative and forthcoming one fact at a time, but unsure of the proper
    name for the payment amount option and needs the agent to identify it.
goal: Make a one-time payment from account 5678 for card 0767, then switch to card
  4421. The customer asks to pay the whole bill amount shown for the due date and
  needs the agent to explain which available payment option that means.
knowledge:
  cards:
  - '0767'
  - '4421'
  accounts:
  - '5678'
success_criteria:
- The available payment amounts include the option matching the customer's informal
  request.
- After the customer switches from card 0767 to card 4421, payment options are fetched
  again for card 4421.
- The payment is validated with AddValidateOneTimePayment before submission.
- The agent obtains explicit confirmation before submitting the payment.
- The confirmed payment is submitted with AddOneTimePayment and the interaction terminates
  successfully.
- Any failure is reported honestly, and all claims remain consistent with tool output.
max_turns: 13
tool_assertions:
- type: amount_in_options
- type: refetch_after_card_switch
- type: validated_submit
  submit: AddOneTimePayment
  validate: AddValidateOneTimePayment
