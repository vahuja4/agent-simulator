name: synth-ecbf1aff1445-c9fc6815f134
journey: J1
description: A cooperative customer wants help making a one-time payment on their
  card. They can provide the card and account identifiers but are unsure which payment
  amount option corresponds to what they intend to pay. The interaction should proceed
  through card selection, available payment options, validation, explicit confirmation,
  and submission, using only the available tool results.
persona:
  name: Cooperative customer
  traits: "Polite, responsive, and willing to follow the agent\u2019s guidance. Provides\
    \ card 9013 and account 5678 when asked. Has a material fluency gap about payment\
    \ amount types: informally asks to pay the whole bill rather than naming the correct\
    \ option, and needs the agent to explain which available option means that."
goal: Make a one-time payment for card 9013 on account 5678, due on the due date,
  using the option that means paying the whole bill. The customer does not know the
  formal name of that amount option and relies on the agent to identify it from the
  available choices.
knowledge:
  cards:
  - '9013'
  accounts:
  - '5678'
success_criteria:
- "The customer\u2019s requested amount is matched to an amount available in the tool\
  \ options."
- The customer explicitly confirms the selected one-time payment before submission.
- The validated one-time payment is submitted using AddOneTimePayment after AddValidateOneTimePayment.
- The interaction reaches the intended goal or honestly reports failure if it cannot.
- Any tool output is represented truthfully.
max_turns: 10
tool_assertions:
- type: amount_in_options
- type: validated_submit
  submit: AddOneTimePayment
  validate: AddValidateOneTimePayment
