  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;phase-combination-builder&quot;&gt;
  &lt;style&gt;
    #phase-combination-builder {
      color: var(--foreground);
      font-size: var(--font-size-base);
    }
    #phase-combination-builder .pcb-heading {
      margin-bottom: 14px;
    }
    #phase-combination-builder .pcb-journey {
      margin-bottom: 22px;
    }
    #phase-combination-builder .pcb-journey-title {
      margin: 0 0 10px;
    }
    #phase-combination-builder .pcb-lane-header,
    #phase-combination-builder .pcb-lane-row {
      display: grid;
      grid-template-columns: 48px repeat(3, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }
    #phase-combination-builder .pcb-lane-header {
      margin-bottom: 4px;
      color: var(--muted-foreground);
      font-weight: 500;
    }
    #phase-combination-builder .pcb-lane-row {
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      transition: background-color 160ms ease;
    }
    #phase-combination-builder .pcb-lane-row.is-active {
      background: color-mix(in srgb, var(--viz-series-1) 10%, transparent);
    }
    #phase-combination-builder .pcb-step-number {
      display: grid;
      place-items: center;
      color: var(--muted-foreground);
    }
    #phase-combination-builder .pcb-lane-cell {
      min-width: 0;
      padding: 7px 8px;
      border-radius: 6px;
      color: var(--muted-foreground);
    }
    #phase-combination-builder .pcb-lane-cell.has-action {
      color: var(--foreground);
    }
    #phase-combination-builder .pcb-lane-cell[data-actor=&quot;customer&quot;].has-action {
      background: color-mix(in srgb, var(--viz-series-2) 14%, transparent);
    }
    #phase-combination-builder .pcb-lane-cell[data-actor=&quot;agent&quot;].has-action {
      background: color-mix(in srgb, var(--viz-series-1) 14%, transparent);
    }
    #phase-combination-builder .pcb-lane-cell[data-actor=&quot;tools&quot;].has-action {
      background: color-mix(in srgb, var(--viz-series-3) 14%, transparent);
    }
    #phase-combination-builder .pcb-journey-branches {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    #phase-combination-builder .pcb-branch {
      padding: 8px 10px;
      border-left: 3px solid var(--border);
      color: var(--muted-foreground);
      background: color-mix(in srgb, var(--muted) 35%, transparent);
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }
    #phase-combination-builder .pcb-branch.is-active {
      border-left-color: var(--viz-series-2);
      color: var(--foreground);
      background: color-mix(in srgb, var(--viz-series-2) 13%, transparent);
    }
    #phase-combination-builder .pcb-branch-label {
      display: block;
      font-weight: 500;
      margin-bottom: 2px;
    }
    #phase-combination-builder .pcb-inputs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }
    #phase-combination-builder .pcb-dimension {
      min-width: 0;
      padding-top: 10px;
      border-top: 3px solid var(--viz-series-1);
    }
    #phase-combination-builder .pcb-dimension:nth-child(2) {
      border-top-color: var(--viz-series-2);
    }
    #phase-combination-builder .pcb-dimension:nth-child(3) {
      border-top-color: var(--viz-series-3);
    }
    #phase-combination-builder .pcb-dimension:nth-child(4) {
      border-top-color: var(--viz-series-4);
    }
    #phase-combination-builder .pcb-number {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      margin-right: 6px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--viz-series-1) 18%, transparent);
      color: var(--foreground);
    }
    #phase-combination-builder .pcb-dimension:nth-child(2) .pcb-number {
      background: color-mix(in srgb, var(--viz-series-2) 18%, transparent);
    }
    #phase-combination-builder .pcb-dimension:nth-child(3) .pcb-number {
      background: color-mix(in srgb, var(--viz-series-3) 18%, transparent);
    }
    #phase-combination-builder .pcb-dimension:nth-child(4) .pcb-number {
      background: color-mix(in srgb, var(--viz-series-4) 18%, transparent);
    }
    #phase-combination-builder .pcb-title {
      margin: 0 0 8px;
      font-weight: 500;
    }
    #phase-combination-builder .pcb-options {
      display: grid;
      gap: 7px;
    }
    #phase-combination-builder .pcb-option {
      display: flex;
      gap: 7px;
      align-items: flex-start;
    }
    #phase-combination-builder .pcb-option input {
      margin-top: 3px;
    }
    #phase-combination-builder .pcb-funnel {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
      gap: 9px;
      align-items: center;
      margin: 22px 0;
    }
    #phase-combination-builder .pcb-stage {
      min-width: 0;
      text-align: center;
    }
    #phase-combination-builder .pcb-stage-mark {
      display: grid;
      place-items: center;
      min-height: 56px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: color-mix(in srgb, var(--muted) 55%, transparent);
      font-weight: 500;
    }
    #phase-combination-builder .pcb-stage.is-final .pcb-stage-mark {
      border-color: var(--viz-series-3);
      background: color-mix(in srgb, var(--viz-series-3) 14%, transparent);
    }
    #phase-combination-builder .pcb-arrow {
      color: var(--muted-foreground);
      font-size: 22px;
    }
    #phase-combination-builder .pcb-result {
      padding: 16px;
    }
    #phase-combination-builder .pcb-result-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    #phase-combination-builder .pcb-result-title {
      margin: 0;
    }
    #phase-combination-builder .pcb-status[data-valid=&quot;true&quot;] {
      background: color-mix(in srgb, var(--green) 18%, transparent);
      color: var(--foreground);
    }
    #phase-combination-builder .pcb-status[data-valid=&quot;false&quot;] {
      background: color-mix(in srgb, var(--red) 18%, transparent);
      color: var(--foreground);
    }
    #phase-combination-builder .pcb-blueprint {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 16px;
    }
    #phase-combination-builder .pcb-path {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    #phase-combination-builder .pcb-node {
      padding: 4px 7px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--viz-series-1) 13%, transparent);
    }
    #phase-combination-builder .pcb-path-arrow {
      color: var(--muted-foreground);
    }
    #phase-combination-builder .pcb-detail-list {
      margin: 0;
      padding-left: 18px;
    }
    #phase-combination-builder .pcb-reason {
      margin-top: 12px;
      color: var(--muted-foreground);
    }
    #phase-combination-builder .pcb-dedup {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    #phase-combination-builder .pcb-key {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    #phase-combination-builder .pcb-key code {
      padding: 4px 7px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--muted) 60%, transparent);
    }
    #phase-combination-builder .pcb-combination-title {
      margin: 0 0 4px;
    }
    #phase-combination-builder .pcb-builder {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.25fr);
      gap: 18px;
      margin-top: 12px;
      align-items: start;
    }
    #phase-combination-builder .pcb-recipe-controls {
      display: grid;
      gap: 12px;
    }
    #phase-combination-builder .pcb-choice-row {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 9px;
      align-items: start;
    }
    #phase-combination-builder .pcb-choice-number {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: var(--foreground);
      background: color-mix(in srgb, var(--viz-series-1) 17%, transparent);
      font-weight: 500;
    }
    #phase-combination-builder .pcb-choice-label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    #phase-combination-builder .pcb-recipe-card {
      padding: 16px;
    }
    #phase-combination-builder .pcb-recipe-title {
      margin: 0 0 10px;
    }
    #phase-combination-builder .pcb-equation {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 14px;
    }
    #phase-combination-builder .pcb-equation-part {
      padding: 5px 7px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--viz-series-1) 12%, transparent);
    }
    #phase-combination-builder .pcb-checks {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }
    #phase-combination-builder .pcb-check-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    #phase-combination-builder .pcb-check-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--muted) 65%, transparent);
      font-weight: 500;
    }
    #phase-combination-builder .pcb-check-title {
      display: block;
      font-weight: 500;
    }
    #phase-combination-builder .pcb-check-result {
      text-align: end;
    }
    @media (max-width: 680px) {
      #phase-combination-builder .pcb-builder {
        grid-template-columns: 1fr;
      }
      #phase-combination-builder .pcb-lane-header {
        display: none;
      }
      #phase-combination-builder .pcb-lane-row {
        grid-template-columns: 36px 1fr;
      }
      #phase-combination-builder .pcb-step-number {
        grid-row: 1 / span 3;
      }
      #phase-combination-builder .pcb-lane-cell {
        grid-column: 2;
      }
      #phase-combination-builder .pcb-lane-cell:not(.has-action) {
        display: none;
      }
      #phase-combination-builder .pcb-lane-cell.has-action::before {
        display: block;
        margin-bottom: 2px;
        color: var(--muted-foreground);
        font-weight: 500;
      }
      #phase-combination-builder .pcb-lane-cell[data-actor=&quot;customer&quot;].has-action::before {
        content: &quot;Customer&quot;;
      }
      #phase-combination-builder .pcb-lane-cell[data-actor=&quot;agent&quot;].has-action::before {
        content: &quot;Agent&quot;;
      }
      #phase-combination-builder .pcb-lane-cell[data-actor=&quot;tools&quot;].has-action::before {
        content: &quot;Tools&quot;;
      }
      #phase-combination-builder .pcb-journey-branches {
        grid-template-columns: 1fr;
      }
      #phase-combination-builder .pcb-inputs {
        grid-template-columns: 1fr 1fr;
      }
      #phase-combination-builder .pcb-funnel {
        grid-template-columns: 1fr;
      }
      #phase-combination-builder .pcb-arrow {
        transform: rotate(90deg);
        text-align: center;
      }
      #phase-combination-builder .pcb-blueprint {
        grid-template-columns: 1fr;
      }
      #phase-combination-builder .pcb-check-row {
        grid-template-columns: 36px 1fr;
      }
      #phase-combination-builder .pcb-check-result {
        grid-column: 2;
        text-align: start;
      }
    }
    @media (max-width: 420px) {
      #phase-combination-builder .pcb-inputs {
        grid-template-columns: 1fr;
      }
      #phase-combination-builder .pcb-result-top {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  &lt;/style&gt;

  &lt;h2 class=&quot;pcb-heading&quot;&gt;How Phase 2 builds one blueprint&lt;/h2&gt;

  &lt;section class=&quot;pcb-journey&quot; aria-label=&quot;Full J1 payment journey&quot;&gt;
    &lt;h3 class=&quot;pcb-journey-title&quot;&gt;J1 payment journey&lt;/h3&gt;
    &lt;div class=&quot;pcb-lane-header&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;span&gt;Step&lt;/span&gt;&lt;span&gt;Customer&lt;/span&gt;&lt;span&gt;Agent&lt;/span&gt;&lt;span&gt;Tools&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;pcb-lane-row&quot; data-journey-node=&quot;disclose&quot;&gt;
      &lt;span class=&quot;pcb-step-number&quot;&gt;1&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell has-action&quot; data-actor=&quot;customer&quot;&gt;Provides card, account, amount and date details&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell&quot; data-actor=&quot;agent&quot;&gt;—&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell&quot; data-actor=&quot;tools&quot;&gt;—&lt;/span&gt;

    &lt;div class=&quot;pcb-lane-row&quot; data-journey-node=&quot;select card&quot;&gt;
      &lt;span class=&quot;pcb-step-number&quot;&gt;2&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell&quot; data-actor=&quot;customer&quot;&gt;—&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell has-action&quot; data-actor=&quot;agent&quot;&gt;Identifies or clarifies the card&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell has-action&quot; data-actor=&quot;tools&quot;&gt;Returns available cards&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;pcb-lane-row&quot; data-journey-node=&quot;fetch options&quot;&gt;
      &lt;span class=&quot;pcb-step-number&quot;&gt;3&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell&quot; data-actor=&quot;customer&quot;&gt;—&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell has-action&quot; data-actor=&quot;agent&quot;&gt;Requests funding and payment options&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell has-action&quot; data-actor=&quot;tools&quot;&gt;Returns accounts, balances and amount choices&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;pcb-lane-row&quot; data-journey-node=&quot;validate&quot;&gt;
      &lt;span class=&quot;pcb-step-number&quot;&gt;4&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell&quot; data-actor=&quot;customer&quot;&gt;—&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell has-action&quot; data-actor=&quot;agent&quot;&gt;Sends the proposed payment for validation&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell has-action&quot; data-actor=&quot;tools&quot;&gt;Checks the payment and returns errors or warnings&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;pcb-lane-row&quot; data-journey-node=&quot;confirm&quot;&gt;
      &lt;span class=&quot;pcb-step-number&quot;&gt;5&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell has-action&quot; data-actor=&quot;customer&quot;&gt;Explicitly approves the validated payment&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell has-action&quot; data-actor=&quot;agent&quot;&gt;Presents the final details and asks for confirmation&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell&quot; data-actor=&quot;tools&quot;&gt;—&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;pcb-lane-row&quot; data-journey-node=&quot;submit&quot;&gt;
      &lt;span class=&quot;pcb-step-number&quot;&gt;6&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell&quot; data-actor=&quot;customer&quot;&gt;—&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell has-action&quot; data-actor=&quot;agent&quot;&gt;Submits only after confirmation&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell has-action&quot; data-actor=&quot;tools&quot;&gt;Executes the payment and returns the result&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;pcb-lane-row&quot; data-journey-node=&quot;terminate&quot;&gt;
      &lt;span class=&quot;pcb-step-number&quot;&gt;7&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell&quot; data-actor=&quot;customer&quot;&gt;—&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell has-action&quot; data-actor=&quot;agent&quot;&gt;Reports success or failure truthfully&lt;/span&gt;
      &lt;span class=&quot;pcb-lane-cell&quot; data-actor=&quot;tools&quot;&gt;—&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;pcb-journey-branches&quot;&gt;
      &lt;div class=&quot;pcb-branch&quot; data-journey-branch=&quot;switch&quot;&gt;
        &lt;span class=&quot;pcb-branch-label&quot;&gt;Card-switch loop&lt;/span&gt;
        Customer switches card → agent requests fresh options → tools return them
      &lt;/div&gt;
      &lt;div class=&quot;pcb-branch&quot; data-journey-branch=&quot;retry&quot;&gt;
        &lt;span class=&quot;pcb-branch-label&quot;&gt;Validation retry&lt;/span&gt;
        Tools return a problem → agent resolves it → tools validate again
      &lt;/div&gt;
      &lt;div class=&quot;pcb-branch&quot; data-journey-branch=&quot;failure&quot;&gt;

      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;text-small text-muted&quot;&gt;The selected procedure path is highlighted.&lt;/div&gt;
  &lt;/section&gt;

  &lt;section aria-label=&quot;Phase 2 combination builder&quot;&gt;
    &lt;h3 class=&quot;pcb-combination-title&quot;&gt;Phase 2 makes a test recipe&lt;/h3&gt;
    &lt;div class=&quot;text-muted&quot;&gt;It chooses one route, a set of rules, test data, and up to two complications.&lt;/div&gt;

    &lt;div class=&quot;pcb-builder&quot;&gt;
      &lt;div class=&quot;pcb-recipe-controls&quot;&gt;
        &lt;div class=&quot;pcb-choice-row&quot;&gt;
          &lt;span class=&quot;pcb-choice-number&quot;&gt;1&lt;/span&gt;
          &lt;div&gt;
            &lt;label class=&quot;pcb-choice-label&quot; for=&quot;pcb-path-select&quot;&gt;Choose a route through the journey&lt;/label&gt;
            &lt;select class=&quot;form-select&quot; id=&quot;pcb-path-select&quot;&gt;
              &lt;option value=&quot;success&quot;&gt;Successful payment&lt;/option&gt;
              &lt;option value=&quot;failure&quot;&gt;Submission fails&lt;/option&gt;
              &lt;option value=&quot;switch&quot; selected&gt;Customer switches card&lt;/option&gt;
              &lt;option value=&quot;retry&quot;&gt;Validation retry&lt;/option&gt;
            &lt;/select&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;pcb-choice-row&quot;&gt;
          &lt;span class=&quot;pcb-choice-number&quot;&gt;2&lt;/span&gt;
          &lt;div&gt;
            &lt;span class=&quot;pcb-choice-label&quot;&gt;Attach behavior rules&lt;/span&gt;
            &lt;div class=&quot;pcb-options&quot;&gt;
              &lt;label class=&quot;pcb-option&quot;&gt;&lt;input type=&quot;checkbox&quot; value=&quot;explicit&quot; checked&gt; &lt;span&gt;Explicit confirmation&lt;/span&gt;&lt;/label&gt;
              &lt;label class=&quot;pcb-option&quot;&gt;&lt;input type=&quot;checkbox&quot; value=&quot;truth&quot; checked&gt; &lt;span&gt;Truthful tool result&lt;/span&gt;&lt;/label&gt;
              &lt;label class=&quot;pcb-option&quot;&gt;&lt;input type=&quot;checkbox&quot; value=&quot;reset&quot; checked&gt; &lt;span&gt;Reset after card switch&lt;/span&gt;&lt;/label&gt;
              &lt;label class=&quot;pcb-option&quot;&gt;&lt;input type=&quot;checkbox&quot; value=&quot;ambiguity&quot;&gt; &lt;span&gt;Last-four disambiguation&lt;/span&gt;&lt;/label&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;pcb-choice-row&quot;&gt;
          &lt;span class=&quot;pcb-choice-number&quot;&gt;3&lt;/span&gt;
          &lt;div&gt;
            &lt;label class=&quot;pcb-choice-label&quot; for=&quot;pcb-fixture-select&quot;&gt;Choose test cards and account&lt;/label&gt;
            &lt;select class=&quot;form-select&quot; id=&quot;pcb-fixture-select&quot;&gt;
              &lt;option value=&quot;single&quot;&gt;One clear card&lt;/option&gt;
              &lt;option value=&quot;distinct&quot; selected&gt;Two cards, distinct balances&lt;/option&gt;

          &lt;span class=&quot;pcb-equation-part&quot;&gt;Route&lt;/span&gt;&lt;span&gt;+&lt;/span&gt;
          &lt;span class=&quot;pcb-equation-part&quot;&gt;Rules&lt;/span&gt;&lt;span&gt;+&lt;/span&gt;

        &lt;div&gt;

        &lt;span class=&quot;viz-badge pcb-status pcb-check-result&quot; id=&quot;pcb-status&quot;&gt;&lt;/span&gt;

        &lt;span class=&quot;pcb-check-mark&quot;&gt;B&lt;/span&gt;

        &lt;span class=&quot;pcb-check-mark&quot;&gt;C&lt;/span&gt;

          &lt;span class=&quot;pcb-check-title&quot;&gt;The survivor joins the blueprint pool&lt;/span&gt;
          Sampling later picks coverage across policy × perturbation categories.
        &lt;/div&gt;
        &lt;span class=&quot;pcb-check-result&quot;&gt;&lt;strong&gt;3,748 kept&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;35 strata&lt;/span&gt;&lt;/span&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;phase-combination-builder&#x27;);
      const pathSelect = root.querySelector(&#x27;#pcb-path-select&#x27;);
      const fixtureSelect = root.querySelector(&#x27;#pcb-fixture-select&#x27;);
      const perturbSelect = root.querySelector(&#x27;#pcb-perturb-select&#x27;);
      const policyInputs = [...root.querySelectorAll(&#x27;.pcb-options input&#x27;)];
      const pathOutput = root.querySelector(&#x27;#pcb-path-output&#x27;);
      const details = root.querySelector(&#x27;#pcb-details&#x27;);
      const status = root.querySelector(&#x27;#pcb-status&#x27;);
      const reason = root.querySelector(&#x27;#pcb-reason&#x27;);
      const journeyNodes = [...root.querySelectorAll(&#x27;[data-journey-node]&#x27;)];
      const journeyBranches = [...root.querySelectorAll(&#x27;[data-journey-branch]&#x27;)];

      const paths = {
        success: [&#x27;disclose&#x27;, &#x27;select card&#x27;, &#x27;fetch options&#x27;, &#x27;validate&#x27;, &#x27;confirm&#x27;, &#x27;submit&#x27;, &#x27;terminate&#x27;],
        failure: [&#x27;disclose&#x27;, &#x27;select card&#x27;, &#x27;fetch options&#x27;, &#x27;validate&#x27;, &#x27;confirm&#x27;, &#x27;submit&#x27;, &#x27;handle failure&#x27;, &#x27;terminate&#x27;],
        switch: [&#x27;disclose&#x27;, &#x27;select card&#x27;, &#x27;fetch options&#x27;, &#x27;select card&#x27;, &#x27;fetch options&#x27;, &#x27;validate&#x27;, &#x27;confirm&#x27;, &#x27;submit&#x27;, &#x27;terminate&#x27;],
        retry: [&#x27;disclose&#x27;, &#x27;select card&#x27;, &#x27;fetch options&#x27;, &#x27;validate&#x27;, &#x27;validate&#x27;, &#x27;confirm&#x27;, &#x27;submit&#x27;, &#x27;terminate&#x27;]
      };
      const pathLabels = {
        success: &#x27;successful payment&#x27;,
        failure: &#x27;submission failure&#x27;,
        switch: &#x27;card switch and fresh options&#x27;,
        retry: &#x27;validation retry&#x27;
      };
      const policyLabels = {
        explicit: &#x27;explicit confirmation&#x27;,
        truth: &#x27;truthful tool result&#x27;,
        reset: &#x27;card-switch reset&#x27;,
        ambiguity: &#x27;last-four disambiguation&#x27;
      };
      const fixtureLabels = {
        single: &#x27;one clear card + account&#x27;,
        distinct: &#x27;two cards with distinct balances + account&#x27;,
        ambiguous: &#x27;two “Freedom” cards with distinct balances + account&#x27;
      };
      const perturbLabels = {
        none: &#x27;none&#x27;,
        partial: &#x27;partial disclosure&#x27;,
        warning: &#x27;validation warning&#x27;,
        &#x27;card-switch&#x27;: &#x27;card switch after options&#x27;,
        &#x27;validation-retry&#x27;: &#x27;validation retry&#x27;,
        &#x27;submit-failure&#x27;: &#x27;submission failure&#x27;
      };

      function selectedPolicies() {
        return policyInputs.filter(input =&gt; input.checked).map(input =&gt; input.value);
      }

      function validationErrors(path, policies, fixture, perturbation) {
        const errors = [];
        const multiDistinct = fixture === &#x27;distinct&#x27; || fixture === &#x27;ambiguous&#x27;;
        if (path === &#x27;switch&#x27; &amp;&amp; !multiDistinct) {
          errors.push(&#x27;The card-switch path requires at least two cards with distinguishable balances.&#x27;);
        }
        if (policies.includes(&#x27;reset&#x27;) &amp;&amp; !multiDistinct) {
          errors.push(&#x27;The card-switch reset policy requires two distinguishable cards.&#x27;);
        }
        if (policies.includes(&#x27;ambiguity&#x27;) &amp;&amp; fixture !== &#x27;ambiguous&#x27;) {
          errors.push(&#x27;Last-four disambiguation requires cards with ambiguous names.&#x27;);
        }
        if (perturbation === &#x27;card-switch&#x27; &amp;&amp; path !== &#x27;switch&#x27;) {
          errors.push(&#x27;The card-switch perturbation needs a path containing the card-switch edge.&#x27;);
        }
        if (perturbation === &#x27;validation-retry&#x27; &amp;&amp; path !== &#x27;retry&#x27;) {
          errors.push(&#x27;The validation-retry perturbation needs a path containing the retry edge.&#x27;);
        }
        return errors;
      }

      function render() {
        const path = pathSelect.value;
        const fixture = fixtureSelect.value;
        const perturbation = perturbSelect.value;
        const policies = selectedPolicies();
        const errors = validationErrors(path, policies, fixture, perturbation);

        const activeNodes = new Set(paths[path]);
        journeyNodes.forEach(node =&gt; {
          node.classList.toggle(&#x27;is-active&#x27;, activeNodes.has(node.dataset.journeyNode));
        });
        journeyBranches.forEach(branch =&gt; {
          branch.classList.toggle(&#x27;is-active&#x27;, branch.dataset.journeyBranch === path);
        });

        pathOutput.replaceChildren();
        paths[path].forEach((node, index) =&gt; {
          if (index &gt; 0) {
            const arrow = document.createElement(&#x27;span&#x27;);
            arrow.className = &#x27;pcb-path-arrow&#x27;;
            arrow.textContent = &#x27;→&#x27;;
            pathOutput.appendChild(arrow);
          }
          const mark = document.createElement(&#x27;span&#x27;);
          mark.className = &#x27;pcb-node&#x27;;
          mark.textContent = node;
          pathOutput.appendChild(mark);
        });

        details.replaceChildren();
        const rows = [
          `Route: ${pathLabels[path]}`,
          `Policies: ${policies.length ? policies.map(item =&gt; policyLabels[item]).join(&#x27;, &#x27;) : &#x27;none&#x27;}`,
          `Fixtures: ${fixtureLabels[fixture]}`,
          `Perturbation: ${perturbLabels[perturbation]}`
        ];
        rows.forEach(text =&gt; {
          const item = document.createElement(&#x27;li&#x27;);
          item.textContent = text;
          details.appendChild(item);
        });

        const valid = errors.length === 0;
        status.dataset.valid = String(valid);
        status.textContent = valid ? &#x27;Survives validation&#x27; : &#x27;Rejected&#x27;;
        reason.textContent = valid
          ? &#x27;The path, policies, fixtures, turn budget and complication are compatible.&#x27;
          : errors.join(&#x27; &#x27;);
      }

      [pathSelect, fixtureSelect, perturbSelect, ...policyInputs].forEach(control =&gt; {
        control.addEventListener(&#x27;change&#x27;, render);
      });
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
